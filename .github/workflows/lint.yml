name: Lint

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-lint-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Check lint
        run: pnpm lint
