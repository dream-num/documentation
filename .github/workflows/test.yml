name: 🧪 Test

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-test-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_DOCS_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Check Build
        run: pnpm build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Validate Showcase
        run: pnpm validate:showcase

      - name: Validate Showcase directory
        run: pnpm test:showcase:directory

      - name: Typecheck Showcase
        run: pnpm typecheck:showcase

      - name: Test Showcase source parity
        run: pnpm test:showcase:source

      - name: Test catalog CSS exports
        run: pnpm test:showcase:css

      - name: Install Chromium for stylesheet isolation checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Test exported Showcase style isolation
        run: pnpm test:showcase:style-isolation

      - name: Test Showcase screenshot capture contract
        run: pnpm test:showcase:screenshot

      - name: Test Showcase compile scope
        run: pnpm test:showcase:scope

      - name: Check lint
        run: pnpm lint
